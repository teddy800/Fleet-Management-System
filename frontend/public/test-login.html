<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Diagnostic Tool - MESSOB FMS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .card h2 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #60a5fa;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .status-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }
    .status-icon.success { background: #10b981; }
    .status-icon.error { background: #ef4444; }
    .status-icon.warning { background: #f59e0b; }
    .status-icon.info { background: #3b82f6; }
    button {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-bottom: 12px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    button.danger {
      background: linear-gradient(135deg, #dc2626, #ef4444);
    }
    button.success {
      background: linear-gradient(135deg, #059669, #10b981);
    }
    .input-group {
      margin-bottom: 16px;
    }
    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
    }
    .input-group input {
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: white;
      font-size: 14px;
    }
    .input-group input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .log {
      background: #000;
      border-radius: 8px;
      padding: 16px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 16px;
    }
    .log-entry {
      margin-bottom: 4px;
      line-height: 1.5;
    }
    .log-entry.success { color: #10b981; }
    .log-entry.error { color: #ef4444; }
    .log-entry.warning { color: #f59e0b; }
    .log-entry.info { color: #60a5fa; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Login Diagnostic Tool</h1>
    <p class="subtitle">Advanced authentication testing and debugging for MESSOB Fleet Management System</p>

    <!-- Status Card -->
    <div class="card">
      <h2>📊 System Status</h2>
      <div id="status-container">
        <div class="status">
          <div class="status-icon info">⏳</div>
          <div>Checking system status...</div>
        </div>
      </div>
    </div>

    <!-- Login Test Card -->
    <div class="card">
      <h2>🧪 Test Login</h2>
      <div class="input-group">
        <label>Username</label>
        <input type="text" id="username" value="admin" placeholder="Enter username">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" value="admin" placeholder="Enter password">
      </div>
      <button onclick="testLogin()">🚀 Test Login</button>
      <button onclick="testMockLogin()" class="success">🎯 Test Mock Login (Fast)</button>
    </div>

    <!-- Storage Management Card -->
    <div class="card">
      <h2>💾 Storage Management</h2>
      <div class="grid">
        <button onclick="checkStorage()">📂 Check Storage</button>
        <button onclick="clearStorage()" class="danger">🗑️ Clear All Storage</button>
        <button onclick="restoreAuth()" class="success">🔄 Restore Auth</button>
        <button onclick="viewStorage()">👁️ View Storage Data</button>
      </div>
    </div>

    <!-- Navigation Test Card -->
    <div class="card">
      <h2>🧭 Navigation Test</h2>
      <div class="grid">
        <button onclick="goToDashboard()">📊 Go to Dashboard</button>
        <button onclick="goToLogin()">🔐 Go to Login</button>
        <button onclick="testNavigation()">🧪 Test Navigation</button>
      </div>
    </div>

    <!-- Console Log Card -->
    <div class="card">
      <h2>📝 Console Log</h2>
      <button onclick="clearLog()">Clear Log</button>
      <div id="log" class="log"></div>
    </div>
  </div>

  <script>
    // Logging utility
    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(message);
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }

    // Check system status
    async function checkSystemStatus() {
      const statusContainer = document.getElementById('status-container');
      statusContainer.innerHTML = '';

      const checks = [
        { name: 'Frontend Server', url: 'http://localhost:3000', type: 'frontend' },
        { name: 'Backend Server', url: 'http://localhost:8069/web', type: 'backend' },
        { name: 'LocalStorage', check: () => !!localStorage.getItem('messob-auth'), type: 'storage' },
        { name: 'SessionStorage Backup', check: () => !!sessionStorage.getItem('messob-auth-backup'), type: 'storage' },
      ];

      for (const check of checks) {
        let status = 'checking';
        let message = 'Checking...';
        
        try {
          if (check.check) {
            const result = check.check();
            status = result ? 'success' : 'warning';
            message = result ? 'Available' : 'Not found';
          } else if (check.url) {
            const response = await fetch(check.url, { method: 'HEAD', mode: 'no-cors' });
            status = 'success';
            message = 'Online';
          }
        } catch (err) {
          status = 'error';
          message = 'Offline or unreachable';
        }

        const statusDiv = document.createElement('div');
        statusDiv.className = 'status';
        statusDiv.innerHTML = `
          <div class="status-icon ${status}">${status === 'success' ? '✓' : status === 'error' ? '✗' : '⚠'}</div>
          <div><strong>${check.name}:</strong> ${message}</div>
        `;
        statusContainer.appendChild(statusDiv);
      }
    }

    // Test mock login (fast, no backend)
    async function testMockLogin() {
      log('🎯 Testing mock login...', 'info');
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const mockUser = {
        id: 1,
        name: 'System Administrator',
        email: username,
        role: 'Admin',
        roles: ['fleet_manager'],
        is_driver: false,
        employee_id: null,
        job_title: 'Administrator',
      };

      const authData = {
        state: {
          user: mockUser,
          isAuthenticated: true,
        },
        version: 0,
        timestamp: Date.now(),
      };

      try {
        const serialized = JSON.stringify(authData);
        localStorage.setItem('messob-auth', serialized);
        sessionStorage.setItem('messob-auth-backup', serialized);
        
        log('✅ Mock auth data saved to storage', 'success');
        log(`✅ User: ${mockUser.name} (${mockUser.role})`, 'success');
        
        // Verify
        const verify = localStorage.getItem('messob-auth');
        if (verify === serialized) {
          log('✅ Storage verification passed', 'success');
          log('🚀 You can now navigate to dashboard', 'success');
        } else {
          log('❌ Storage verification failed', 'error');
        }
      } catch (err) {
        log(`❌ Mock login failed: ${err.message}`, 'error');
      }
    }

    // Test real login
    async function testLogin() {
      log('🚀 Testing real login...', 'info');
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        log(`📝 Attempting login for: ${username}`, 'info');
        
        const response = await fetch('/web/session/authenticate', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            jsonrpc: '2.0',
            method: 'call',
            id: 1,
            params: {
              db: 'messob_db',
              login: username,
              password: password,
            },
          }),
        });

        const data = await response.json();
        log('📦 Response received', 'info');

        if (data.result && data.result.uid) {
          log(`✅ Login successful! UID: ${data.result.uid}`, 'success');
          log(`✅ User: ${data.result.name}`, 'success');
          
          // Save to storage
          const authData = {
            state: {
              user: {
                id: data.result.uid,
                name: data.result.name,
                email: username,
                role: 'Admin',
                roles: ['fleet_manager'],
              },
              isAuthenticated: true,
            },
            version: 0,
          };
          
          localStorage.setItem('messob-auth', JSON.stringify(authData));
          sessionStorage.setItem('messob-auth-backup', JSON.stringify(authData));
          log('✅ Auth data saved to storage', 'success');
        } else {
          log('❌ Login failed: Invalid credentials', 'error');
        }
      } catch (err) {
        log(`❌ Login error: ${err.message}`, 'error');
      }
    }

    // Check storage
    function checkStorage() {
      log('📂 Checking storage...', 'info');
      
      const ls = localStorage.getItem('messob-auth');
      const ss = sessionStorage.getItem('messob-auth-backup');
      
      if (ls) {
        try {
          const parsed = JSON.parse(ls);
          log(`✅ LocalStorage: Found auth data for ${parsed.state?.user?.name}`, 'success');
        } catch {
          log('⚠️ LocalStorage: Invalid data', 'warning');
        }
      } else {
        log('❌ LocalStorage: No auth data', 'error');
      }
      
      if (ss) {
        log('✅ SessionStorage: Backup exists', 'success');
      } else {
        log('⚠️ SessionStorage: No backup', 'warning');
      }
    }

    // Clear storage
    function clearStorage() {
      if (confirm('Clear all authentication data?')) {
        localStorage.removeItem('messob-auth');
        sessionStorage.removeItem('messob-auth-backup');
        sessionStorage.removeItem('messob-session-active');
        document.cookie.split(";").forEach(c => {
          document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
        });
        log('✅ All storage cleared', 'success');
        checkSystemStatus();
      }
    }

    // Restore auth
    function restoreAuth() {
      log('🔄 Attempting to restore auth...', 'info');
      
      const ss = sessionStorage.getItem('messob-auth-backup');
      if (ss) {
        localStorage.setItem('messob-auth', ss);
        log('✅ Restored from sessionStorage backup', 'success');
      } else {
        log('❌ No backup available', 'error');
      }
    }

    // View storage
    function viewStorage() {
      log('👁️ Viewing storage data...', 'info');
      
      const ls = localStorage.getItem('messob-auth');
      if (ls) {
        try {
          const parsed = JSON.parse(ls);
          log(JSON.stringify(parsed, null, 2), 'info');
        } catch {
          log('Invalid JSON in storage', 'error');
        }
      } else {
        log('No data in storage', 'warning');
      }
    }

    // Navigation tests
    function goToDashboard() {
      log('🚀 Navigating to dashboard...', 'info');
      window.location.href = '/dashboard';
    }

    function goToLogin() {
      log('🔐 Navigating to login...', 'info');
      window.location.href = '/login';
    }

    function testNavigation() {
      log('🧪 Testing navigation...', 'info');
      const hasAuth = !!localStorage.getItem('messob-auth');
      
      if (hasAuth) {
        log('✅ Auth data exists - should be able to access dashboard', 'success');
        log('🚀 Attempting navigation in 2 seconds...', 'info');
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 2000);
      } else {
        log('❌ No auth data - need to login first', 'error');
      }
    }

    // Initialize
    window.addEventListener('load', () => {
      log('🔐 Login Diagnostic Tool loaded', 'success');
      checkSystemStatus();
    });
  </script>
</body>
</html>
