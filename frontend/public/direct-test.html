<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Auth Test - MESSOB FMS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 32px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #60a5fa;
    }
    p {
      color: #94a3b8;
      margin-bottom: 24px;
      font-size: 14px;
    }
    button {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    button.success {
      background: linear-gradient(135deg, #059669, #10b981);
    }
    button.danger {
      background: linear-gradient(135deg, #dc2626, #ef4444);
    }
    .log {
      background: #000;
      border-radius: 8px;
      padding: 16px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-height: 400px;
      overflow-y: auto;
      margin-top: 16px;
    }
    .log-entry {
      margin-bottom: 4px;
      line-height: 1.5;
    }
    .log-entry.success { color: #10b981; }
    .log-entry.error { color: #ef4444; }
    .log-entry.warning { color: #f59e0b; }
    .log-entry.info { color: #60a5fa; }
    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 8px;
    }
    .status.success { background: #10b981; color: #000; }
    .status.error { background: #ef4444; color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🔬 Direct Authentication Test</h1>
      <p>This page tests authentication WITHOUT React - pure JavaScript only</p>
      
      <button onclick="testDirectLogin()">🚀 Test Direct Login</button>
      <button onclick="checkStorage()" class="success">📂 Check Storage</button>
      <button onclick="navigateToDashboard()" class="success">📊 Go to Dashboard</button>
      <button onclick="clearAll()" class="danger">🗑️ Clear All</button>
      
      <div id="log" class="log"></div>
    </div>
  </div>

  <script>
    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(message);
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }

    async function testDirectLogin() {
      clearLog();
      log('🚀 Starting direct login test...', 'info');
      
      try {
        // Step 1: Create auth data
        log('📝 Creating auth data...', 'info');
        const authData = {
          state: {
            user: {
              id: 1,
              name: 'System Administrator',
              email: 'admin',
              role: 'Admin',
              roles: ['admin'],
              is_driver: false,
              employee_id: null,
              job_title: 'Administrator',
            },
            isAuthenticated: true,
          },
          version: 0,
          timestamp: Date.now(),
        };
        
        // Step 2: Write to storage SYNCHRONOUSLY
        log('💾 Writing to localStorage...', 'info');
        const serialized = JSON.stringify(authData);
        localStorage.setItem('messob-auth', serialized);
        
        log('💾 Writing to sessionStorage...', 'info');
        sessionStorage.setItem('messob-auth-backup', serialized);
        
        // Step 3: Verify immediately
        log('🔍 Verifying storage...', 'info');
        const verify1 = localStorage.getItem('messob-auth');
        const verify2 = sessionStorage.getItem('messob-auth-backup');
        
        if (verify1 && verify2) {
          log('✅ Storage write successful!', 'success');
          log(`✅ localStorage: ${verify1.length} bytes`, 'success');
          log(`✅ sessionStorage: ${verify2.length} bytes`, 'success');
          
          // Step 4: Parse and verify
          const parsed = JSON.parse(verify1);
          log('📦 Parsed data:', 'info');
          log(`  - isAuthenticated: ${parsed.state.isAuthenticated}`, 'info');
          log(`  - user.name: ${parsed.state.user.name}`, 'info');
          log(`  - user.role: ${parsed.state.user.role}`, 'info');
          
          log('', 'info');
          log('✅ AUTH DATA READY!', 'success');
          log('🚀 You can now click "Go to Dashboard"', 'success');
          
        } else {
          log('❌ Storage write failed!', 'error');
          if (!verify1) log('  - localStorage is empty', 'error');
          if (!verify2) log('  - sessionStorage is empty', 'error');
        }
        
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
        console.error(error);
      }
    }

    function checkStorage() {
      clearLog();
      log('🔍 Checking storage...', 'info');
      
      const ls = localStorage.getItem('messob-auth');
      const ss = sessionStorage.getItem('messob-auth-backup');
      
      if (ls) {
        try {
          const parsed = JSON.parse(ls);
          log('✅ localStorage has auth data:', 'success');
          log(`  - isAuthenticated: ${parsed.state?.isAuthenticated}`, 'info');
          log(`  - user: ${parsed.state?.user?.name}`, 'info');
          log(`  - role: ${parsed.state?.user?.role}`, 'info');
        } catch (e) {
          log('❌ localStorage has invalid data', 'error');
        }
      } else {
        log('❌ localStorage is empty', 'error');
      }
      
      if (ss) {
        log('✅ sessionStorage backup exists', 'success');
      } else {
        log('⚠️ sessionStorage backup is empty', 'warning');
      }
    }

    function navigateToDashboard() {
      log('🚀 Navigating to dashboard...', 'info');
      log('⏳ Waiting 1 second...', 'info');
      
      setTimeout(() => {
        log('🚀 Redirecting now...', 'success');
        window.location.href = '/dashboard';
      }, 1000);
    }

    function clearAll() {
      clearLog();
      log('🗑️ Clearing all storage...', 'warning');
      localStorage.clear();
      sessionStorage.clear();
      log('✅ All storage cleared', 'success');
    }

    // Auto-check on load
    window.addEventListener('load', () => {
      log('🔬 Direct Auth Test loaded', 'success');
      log('Click "Test Direct Login" to create auth data', 'info');
      log('Then click "Go to Dashboard" to test navigation', 'info');
    });
  </script>
</body>
</html>
